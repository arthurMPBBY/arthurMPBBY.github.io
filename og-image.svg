<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="emeraldAura" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a3d32" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#071b17" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070b0e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="astroGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#16222c" stroke-width="0.8" stroke-dasharray="2 4" />
    </pattern>
  </defs>

  <!-- Dark Chamber Base -->
  <rect width="1200" height="630" fill="#070b0e" />
  <rect width="1200" height="630" fill="url(#astroGrid)" />
  <rect width="1200" height="630" fill="url(#emeraldAura)" />

  <!-- Left Editorial Column -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" fill="#f1f5f9">
    <text x="72" y="78" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2.5" fill="#f59e0b">OBSERVATÓRIO ÓPTICO · GIROSCÓPIO · 06 PROJETOS</text>
    
    <text x="68" y="195" font-size="94" font-weight="800" letter-spacing="-4" fill="#ffffff">ARTHUR</text>
    <text x="68" y="288" font-size="94" font-weight="800" letter-spacing="-4" fill="#ffffff">KADRI<tspan fill="#f59e0b">.</tspan></text>
    
    <text x="72" y="348" font-size="22" font-weight="500" fill="#94a3b8">Atlas Espacial de Sistemas &amp; Arquiteturas Interativas.</text>
    <text x="72" y="388" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#cbd5e1">C# (Win32/DWM) · Python (Sockets/TCP) · C++ (Vulkan) · Finanças</text>

    <line x1="72" y1="428" x2="540" y2="428" stroke="#223240" stroke-width="1.2" />

    <circle cx="80" cy="466" r="4.5" fill="#f59e0b" />
    <text x="96" y="471" font-size="16" fill="#e2e8f0">UFABC · 2º período · Em busca de estágio em Dados / Finanças</text>
    <text x="72" y="504" font-size="15" fill="#64748b">Portfólio com navegação contínua, gimbals ópticos e 6 salas técnicas.</text>

    <g transform="translate(72, 546)">
      <rect width="210" height="36" rx="4" fill="#0e1720" stroke="#26394a" stroke-width="1" />
      <text x="18" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f59e0b">arthurmpbby.github.io</text>
    </g>
  </g>

  <!-- Right Perspective Gyroscope Rings Mechanism -->
  <g transform="translate(860, 315)">
    <!-- Ambient Chamber Rings -->
    <circle r="260" fill="none" stroke="#12202a" stroke-width="1" />
    <circle r="235" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 8" />
    <circle r="200" fill="none" stroke="#162734" stroke-width="1.5" />

    <!-- Crosshair Reticles -->
    <line x1="-270" y1="0" x2="270" y2="0" stroke="#1e3140" stroke-width="0.8" stroke-dasharray="3 6" />
    <line x1="0" y1="-270" x2="0" y2="270" stroke="#1e3140" stroke-width="0.8" stroke-dasharray="3 6" />

    <!-- Foreshortened 3D Ring 4: Outer Gimbal (Graphite + Emerald Rim) -->
    <ellipse rx="220" ry="135" fill="none" stroke="#2c3e50" stroke-width="14" transform="rotate(-22)" />
    <ellipse rx="220" ry="135" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" transform="rotate(-22)" />

    <!-- Foreshortened 3D Ring 3: Primary Calibrated Ring (Amber Markings) -->
    <ellipse rx="175" ry="105" fill="none" stroke="#1a2530" stroke-width="10" transform="rotate(32)" />
    <ellipse rx="175" ry="105" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="14 6 4 6" transform="rotate(32)" />

    <!-- Foreshortened 3D Ring 2: Vernier Scale Ring -->
    <ellipse rx="130" ry="76" fill="none" stroke="#2a3b4c" stroke-width="8" transform="rotate(-42)" />
    <ellipse rx="130" ry="76" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 4" transform="rotate(-42)" />

    <!-- Foreshortened 3D Ring 1: Inner Collar -->
    <ellipse rx="88" ry="52" fill="none" stroke="#111c26" stroke-width="6" transform="rotate(18)" />
    <ellipse rx="88" ry="52" fill="none" stroke="#64748b" stroke-width="1.4" transform="rotate(18)" />

    <!-- Center Optical Aperture & Core Glow -->
    <circle r="46" fill="#030508" stroke="#f59e0b" stroke-width="2.5" />
    <circle r="46" fill="url(#amberCoreGlow)" />
    <circle r="22" fill="#000000" stroke="#334155" stroke-width="1.2" />
    <circle r="6" fill="#f59e0b" />

    <!-- Caliper / Vernier Cursor -->
    <path d="M 0 -130 L 12 -150 L -12 -150 Z" fill="#f59e0b" transform="rotate(32)" />
    <path d="M 0 130 L 12 150 L -12 150 Z" fill="#f59e0b" transform="rotate(32)" />

    <text x="0" y="275" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#64748b">CÂMARA ÓPTICA · 3D GIMBAL PREVIEW</text>
  </g>
</svg>
