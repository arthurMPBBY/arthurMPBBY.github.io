<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#070b0e" />
  <rect x="1" y="1" width="62" height="62" rx="9" fill="none" stroke="#1c2833" stroke-width="1.5" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.35" />
  <!-- Outer Gimbal Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="16" fill="none" stroke="#334155" stroke-width="2" transform="rotate(-25 32 32)" />
  <!-- Intermediate Gimbal Ring with amber calibrations -->
  <ellipse cx="32" cy="32" rx="17" ry="12" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6 3 2 3" transform="rotate(35 32 32)" />
  <!-- Inner Core Ring -->
  <ellipse cx="32" cy="32" rx="10" ry="7" fill="none" stroke="#94a3b8" stroke-width="1.4" transform="rotate(-15 32 32)" />
  <!-- Central Optical Core -->
  <circle cx="32" cy="32" r="4.5" fill="#030608" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="32" cy="32" r="1.5" fill="#fbbf24" />
</svg>
